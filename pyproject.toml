[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molecular-analogue-generator"
version = "0.1.0"
description = "RDKit-based molecular analogue generation and PubChem screening"
requires-python = ">=3.10"
dependencies = ["rdkit", "requests", "pandas", "numpy", "matplotlib", "ipython"]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]
